# preload-dpumesh (service_id=15): LD_PRELOAD shim validator. Runs vanilla TCP
# binaries (tcp_echo + tcp_client) under LD_PRELOAD=libdmesh_preload.so.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preload-dpumesh
spec:
  replicas: 0
  selector: { matchLabels: { app: preload-dpumesh } }
  template:
    metadata:
      annotations: { config.linkerd.io/skip-inbound-ports: "${CTRL_PORT},9095" }
      labels: { app: preload-dpumesh, linkerd.io/control-plane-ns: linkerd }
    spec:
      hostname: preload-dpumesh
      containers:
      - name: preload-dpumesh
        image: docker.io/${IMG_PRELOAD_DPU}
        imagePullPolicy: Never
        ports: [{ containerPort: ${CTRL_PORT} }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: DPUMESH_PCI_ADDR, value: "${HOST_PCI}" }
        - { name: DPUMESH_RINGS_PER_POD, value: "${DPUMESH_RINGS_PER_POD}" }
        - { name: DPUMESH_ATTEST_SOCKET, value: "${DPUMESH_ATTEST_SOCKET}" }
        - { name: ECHO_PORT, value: "9095" }
        - { name: DMESH_PRELOAD_DEBUG, value: "${DMESH_PRELOAD_DEBUG}" }
        securityContext: { privileged: true }
        volumeMounts:
        - { mountPath: /dev/infiniband, name: infiniband }
        - { mountPath: /usr/local/lib/libdpumesh.so.5, name: libdpumesh-so, subPath: libdpumesh.so.5 }
        - { mountPath: /run/dpumesh, name: dpumesh-attest, readOnly: true }
      volumes:
      - { name: infiniband, hostPath: { path: /dev/infiniband } }
      - { name: libdpumesh-so, hostPath: { path: ${LIB_OUT}, type: Directory } }
      - { name: dpumesh-attest, hostPath: { path: /run/dpumesh, type: DirectoryOrCreate } }
---
apiVersion: v1
kind: Service
metadata: { name: preload-dpumesh }
spec:
  selector: { app: preload-dpumesh }
  # The echo port is first: the topology generation publishes ports[0], which
  # is what the shim's connect() resolution matches on.
  ports:
  - { name: echo, port: 9095, targetPort: 9095 }
  - { name: ctrl, port: ${CTRL_PORT}, targetPort: ${CTRL_PORT} }
---
# preload-sock: bench_sock/echo_sock workload over LD_PRELOAD. The
# control listener is ordinary kernel TCP; only BENCH_TARGET data connections
# are intercepted. The client resolves the Service's ClusterIP through the DPU
# (kubelet injects it as PRELOAD_DPUMESH_SERVICE_HOST), so nothing is baked
# into the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preload-echo
spec:
  replicas: 0
  selector: { matchLabels: { app: preload-echo } }
  template:
    metadata:
      annotations: { config.linkerd.io/skip-inbound-ports: "9100" }
      labels: { app: preload-echo, linkerd.io/control-plane-ns: linkerd }
    spec:
      hostname: preload-echo
      containers:
      - name: preload-echo
        image: docker.io/${IMG_PRELOAD_SOCK}
        imagePullPolicy: Never
        command: ["/usr/local/bin/numa-entrypoint.sh"]
        args: ["/usr/local/bin/echo_sock"]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: DPUMESH_PCI_ADDR, value: "${HOST_PCI}" }
        - { name: DPUMESH_RINGS_PER_POD, value: "${DPUMESH_RINGS_PER_POD}" }
        - { name: DPUMESH_ATTEST_SOCKET, value: "${DPUMESH_ATTEST_SOCKET}" }
        - { name: DPUMESH_SERVICE, value: "preload-sock" }
        - { name: DPUMESH_PORT, value: "9100" }
        - { name: ECHO_PORT, value: "9100" }
        - { name: NUMA_TARGET_LD_PRELOAD, value: "/usr/local/lib/libdmesh_preload.so" }
        securityContext: { privileged: true }
        volumeMounts:
        - { mountPath: /dev/infiniband, name: infiniband }
        - { mountPath: /usr/local/lib/libdpumesh.so.5, name: libdpumesh-so, subPath: libdpumesh.so.5 }
        - { mountPath: /run/dpumesh, name: dpumesh-attest, readOnly: true }
      volumes:
      - { name: infiniband, hostPath: { path: /dev/infiniband } }
      - { name: libdpumesh-so, hostPath: { path: ${LIB_OUT}, type: Directory } }
      - { name: dpumesh-attest, hostPath: { path: /run/dpumesh, type: DirectoryOrCreate } }
---
