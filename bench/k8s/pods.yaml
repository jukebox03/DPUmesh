# Native and preload workloads for the DPU-hosted Linkerd/DMA mesh.
# bench.sh substitutes image, port, PCI, library, and runtime variables before
# applying the manifest. Deployments start with zero replicas.
#
# Harness arm, kept beside the deployment path for comparison: this manifest
# hand-writes what the admission webhook (bench/k8s/webhook.yaml) injects from
# one annotation, so a measurement never depends on the injection path the
# inject campaign tests. A production workload gets all of this from the
# annotation, not from a manifest like this one.
# `linkerd.io/control-plane-ns` enrolls each sidecarless workload in Linkerd's
# inbound policy index. The skip annotation keeps destination discovery from
# expecting a Pod-local proxy on DMA ports; the embedded DPU proxy enforces it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-dpumesh
spec:
  replicas: 0
  selector: { matchLabels: { app: bench-dpumesh } }
  template:
    metadata:
      annotations: { config.linkerd.io/skip-inbound-ports: "${CTRL_PORT}" }
      labels: { app: bench-dpumesh, linkerd.io/control-plane-ns: linkerd }
    spec:
      hostname: bench-dpumesh
      containers:
      - name: bench-dpumesh
        image: docker.io/${IMG_BENCH_DPU}
        imagePullPolicy: Never
        ports: [{ containerPort: ${CTRL_PORT} }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: DPUMESH_PCI_ADDR, value: "${HOST_PCI}" }
        - { name: DPUMESH_RINGS_PER_POD, value: "${DPUMESH_RINGS_PER_POD}" }
        - { name: DPUMESH_ATTEST_SOCKET, value: "${DPUMESH_ATTEST_SOCKET}" }
        - { name: BENCH_DST_SERVICE, value: "echo-dpumesh" }   # peer by k8s Service NAME (pure client)
        - { name: BENCH_DST_SERVICES, value: "${BENCH_DST_SERVICES}" } # optional per-thread CSV
        securityContext: { privileged: true }
        volumeMounts:
        - { mountPath: /dev/infiniband, name: infiniband }
        - { mountPath: /usr/local/lib/libdpumesh.so.5, name: libdpumesh-so, subPath: libdpumesh.so.5 }
        - { mountPath: /run/dpumesh, name: dpumesh-attest, readOnly: true }
      volumes:
      - { name: infiniband, hostPath: { path: /dev/infiniband } }
      - { name: libdpumesh-so, hostPath: { path: ${LIB_OUT}, type: Directory } }
      - { name: dpumesh-attest, hostPath: { path: /run/dpumesh, type: DirectoryOrCreate } }
---
apiVersion: v1
kind: Service
metadata: { name: bench-dpumesh }
spec:
  selector: { app: bench-dpumesh }
  ports: [{ port: ${CTRL_PORT}, targetPort: ${CTRL_PORT} }]
---
