# The injection arm: what a workload looks like when the mesh injects itself.
#
# Nothing here names a device, a library, a shim, a socket or a policy. Both
# server Deployments are identical apart from the injection annotations and the
# port they serve, which is what makes the pair a control: the annotated one
# must come up meshed, and the other one must come up as the ordinary TCP
# workload it was written as.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inject-echo
spec:
  replicas: 0
  selector: { matchLabels: { app: inject-echo } }
  template:
    metadata:
      annotations:
        dpumesh.io/inject: "enabled"
        # This image defers the preload past numactl, so it names its own variable.
        dpumesh.io/preload-var: NUMA_TARGET_LD_PRELOAD
      labels: { app: inject-echo, dpumesh-service: inject-sock }
    spec:
      hostname: inject-echo
      containers:
      - name: inject-echo
        image: docker.io/${IMG_PRELOAD_SOCK}
        imagePullPolicy: Never
        command: ["/usr/local/bin/numa-entrypoint.sh"]
        args: ["/usr/local/bin/echo_sock"]
        ports: [{ containerPort: 9101 }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: DPUMESH_PORT, value: "9101" }
        - { name: ECHO_PORT, value: "9101" }
---
apiVersion: v1
kind: Service
metadata: { name: inject-sock }
spec:
  clusterIP: 10.96.0.21
  selector: { app: inject-echo }
  ports: [{ port: 9101, targetPort: 9101 }]
---
# The same Deployment without the annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-echo
spec:
  replicas: 0
  selector: { matchLabels: { app: plain-echo } }
  template:
    metadata:
      labels: { app: plain-echo }
    spec:
      hostname: plain-echo
      containers:
      - name: plain-echo
        image: docker.io/${IMG_PRELOAD_SOCK}
        imagePullPolicy: Never
        command: ["/usr/local/bin/numa-entrypoint.sh"]
        args: ["/usr/local/bin/echo_sock"]
        ports: [{ containerPort: 9102 }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: DPUMESH_PORT, value: "9102" }
        - { name: ECHO_PORT, value: "9102" }
---
apiVersion: v1
kind: Service
metadata: { name: plain-sock }
spec:
  clusterIP: 10.96.0.22
  selector: { app: plain-echo }
  ports: [{ port: 9102, targetPort: 9102 }]
---
# The client is annotated too: it has to be meshed to reach the meshed server
# over DMA, and it reaches the unmeshed one over kernel TCP from the same
# process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inject-bench
spec:
  replicas: 0
  selector: { matchLabels: { app: inject-bench } }
  template:
    metadata:
      annotations:
        dpumesh.io/inject: "enabled"
        # This image defers the preload past numactl, so it names its own variable.
        dpumesh.io/preload-var: NUMA_TARGET_LD_PRELOAD
      labels: { app: inject-bench }
    spec:
      hostname: inject-bench
      containers:
      - name: inject-bench
        image: docker.io/${IMG_PRELOAD_SOCK}
        imagePullPolicy: Never
        command: ["/usr/local/bin/numa-entrypoint.sh"]
        args: ["/usr/local/bin/bench_sock"]
        ports: [{ containerPort: ${CTRL_PORT} }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TARGET, value: "10.96.0.21:9101" }
        - { name: CTRL_PORT, value: "${CTRL_PORT}" }
---
apiVersion: v1
kind: Service
metadata: { name: inject-bench }
spec:
  selector: { app: inject-bench }
  ports: [{ port: ${CTRL_PORT}, targetPort: ${CTRL_PORT} }]
---
# The unmeshed control's client: the same image reaching the unmeshed server.
# Neither end is patched, so neither is preloaded and both are ordinary
# kernel TCP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-bench
spec:
  replicas: 0
  selector: { matchLabels: { app: plain-bench } }
  template:
    metadata:
      labels: { app: plain-bench }
    spec:
      hostname: plain-bench
      containers:
      - name: plain-bench
        image: docker.io/${IMG_PRELOAD_SOCK}
        imagePullPolicy: Never
        command: ["/usr/local/bin/numa-entrypoint.sh"]
        args: ["/usr/local/bin/bench_sock"]
        ports: [{ containerPort: ${CTRL_PORT} }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TARGET, value: "10.96.0.22:9102" }
        - { name: CTRL_PORT, value: "${CTRL_PORT}" }
---
apiVersion: v1
kind: Service
metadata: { name: plain-bench }
spec:
  selector: { app: plain-bench }
  ports: [{ port: ${CTRL_PORT}, targetPort: ${CTRL_PORT} }]
