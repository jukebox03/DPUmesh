apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dpumesh-node-agent
subjects:
- kind: ServiceAccount
  name: dpumesh-node-agent
  namespace: ${NS}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpumesh-service-registry
  namespace: ${NS}
data:
  registry: |
${DPUMESH_REGISTRY_YAML}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
spec:
  selector:
    matchLabels: { app: dpumesh-node-agent }
  template:
    metadata:
      labels: { app: dpumesh-node-agent }
    spec:
      serviceAccountName: dpumesh-node-agent
      hostPID: true
      terminationGracePeriodSeconds: 5
      containers:
      - name: workload-agent
        image: docker.io/${IMG_WORKLOAD_AGENT}
        imagePullPolicy: Never
        args:
        - --socket=/run/dpumesh/attest.sock
        - --key-dir=/etc/dpumesh/registration.keys
        - --registry=/etc/dpumesh/registry
        - --namespace=${NS}
        - --node-name=$(NODE_NAME)
        - --issuer=${DPUMESH_REGISTRATION_ISSUER}
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        readinessProbe:
          exec: { command: ["python3", "-c", "import os; assert os.path.exists('/run/dpumesh/attest.sock')"] }
          initialDelaySeconds: 1
          periodSeconds: 2
        volumeMounts:
        - { name: socket, mountPath: /run/dpumesh }
        - { name: keyring, mountPath: /etc/dpumesh/registration.keys, readOnly: true }
        - { name: registry, mountPath: /etc/dpumesh/registry, subPath: registry, readOnly: true }
      volumes:
      - name: socket
        hostPath: { path: /run/dpumesh, type: DirectoryOrCreate }
      - name: keyring
        hostPath: { path: /etc/dpumesh/registration.keys, type: Directory }
      - name: registry
        configMap: { name: dpumesh-service-registry }
