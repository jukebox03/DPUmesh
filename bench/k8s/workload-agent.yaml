apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
# The identity bundle the DPU presents to the Linkerd control plane is minted
# here, on the cadence the token's lifetime asks for, rather than by a user
# unit on an operator's login path.
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dpumesh-node-agent
subjects:
- kind: ServiceAccount
  name: dpumesh-node-agent
  namespace: ${NS}
---
# The absorbed control-plane relay resolves the Linkerd Services it forwards
# to. This is the gateway DaemonSet's former Role, rebound to the agent: one
# Pod with two listeners, and the same namespaced read it always had.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dpumesh-node-agent-relay
  namespace: ${LINKERD_CONTROL_NAMESPACE}
rules:
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dpumesh-node-agent-relay
  namespace: ${LINKERD_CONTROL_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dpumesh-node-agent-relay
subjects:
- kind: ServiceAccount
  name: dpumesh-node-agent
  namespace: ${NS}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dpumesh-node-agent
  namespace: ${NS}
spec:
  selector:
    matchLabels: { app: dpumesh-node-agent }
  template:
    metadata:
      labels: { app: dpumesh-node-agent }
    spec:
      serviceAccountName: dpumesh-node-agent
      hostPID: true
      # The DPU is reached on the management interface and the control-plane
      # relay listens on it, so the agent shares the node's network. It is
      # also what lets the controller bind a node report to its reporter: the
      # source address of the report is the node's own.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 5
      containers:
      - name: workload-agent
        image: docker.io/${IMG_WORKLOAD_AGENT}
        imagePullPolicy: Never
        args:
        - --socket=/run/dpumesh/attest.sock
        - --key-dir=/etc/dpumesh/registration.keys
        - --feed-key-dir=/etc/dpumesh/feed.keys
        - --namespace=${NS}
        - --node-name=$(NODE_NAME)
        - --broker-bin=/usr/local/bin/dmesh_broker
        - --host-cgroup-root=/host-cgroup
        - --broker-state-dir=/run/dpumesh/brokers
        - --broker-runtime-dir=/var/lib/dpumesh/broker-runtime
        # The DPU's only control peer: the delivery hop and what travels on it.
        - --dpu-feed-host=${DPUMESH_DPU_FEED_HOST}
        - --dpu-feed-port=${DPUMESH_DPU_FEED_PORT}
        - --controller-url=${DPUMESH_CONTROLLER_URL}
        - --nodes-file=/etc/dpumesh/nodes
        - --identity-dir=/run/dpumesh/linkerd-identity
        - --identity-service-account=${LINKERD_IDENTITY_SERVICE_ACCOUNT}
        - --identity-trust-namespace=${LINKERD_CONTROL_NAMESPACE}
        # The kernel road around the mesh: without this the node forwards a
        # plain TCP SYN from any unmeshed Pod straight to a port the DPU
        # serves over DMA.
        - --protect-ingress
${DPUMESH_AGENT_SERVICE_ARGS}
        # The absorbed control-plane relay.
        - --kube-route=destination=${LINKERD_GATEWAY_BIND}:${LINKERD_GATEWAY_DST_PORT}->${LINKERD_CONTROL_NAMESPACE}/linkerd-dst:8086
        - --kube-route=policy=${LINKERD_GATEWAY_BIND}:${LINKERD_GATEWAY_POLICY_PORT}->${LINKERD_CONTROL_NAMESPACE}/linkerd-policy:8090
        - --kube-route=identity=${LINKERD_GATEWAY_BIND}:${LINKERD_GATEWAY_IDENTITY_PORT}->${LINKERD_CONTROL_NAMESPACE}/linkerd-identity:8080
        # The mediated control-plane lookup. It travels this route and no
        # other, which is what binds the question to the node asking it: the
        # controller sees this node's own address.
        - --kube-route=controller=${LINKERD_GATEWAY_BIND}:${DPUMESH_CONTROLLER_RELAY_PORT}->${NS}/dpumesh-controller:8080
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - { name: DPUMESH_PCI_ADDR, value: "${HOST_PCI}" }
        - { name: DPUMESH_RINGS_PER_POD, value: "${DPUMESH_RINGS_PER_POD}" }
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          # The node's default CRI AppArmor profile denies opening namespace
          # handles even with the narrowly requested capabilities. This is the
          # trusted node agent (not a workload); its children still drop into
          # an attested Pod cgroup before any DOCA setup.
          appArmorProfile: { type: Unconfined }
          # DAC_READ_SEARCH: the identity staging key (key.p8, 0600,
          # operator-owned) must be readable through the read-only hostPath
          # mount, and a root uid alone does not bypass file modes once every
          # capability is dropped. NET_ADMIN: the ingress guard writes the
          # host's FORWARD chain, and hostNetwork is what points iptables at
          # the host rather than a Pod namespace. SYS_ADMIN enters the host
          # cgroup namespace only in a broker child; SYS_PTRACE permits opening
          # PID 1's namespace handle under the kernel ptrace access check.
          capabilities: { drop: ["ALL"], add: ["DAC_READ_SEARCH", "NET_ADMIN", "SYS_ADMIN", "SYS_PTRACE", "IPC_LOCK", "SETUID", "SETGID", "KILL"] }
        readinessProbe:
          exec: { command: ["python3", "-c", "import os; assert os.path.exists('/run/dpumesh/attest.sock')"] }
          initialDelaySeconds: 1
          periodSeconds: 2
        volumeMounts:
        - { name: socket, mountPath: /run/dpumesh }
        - { name: keyring, mountPath: /etc/dpumesh/registration.keys, readOnly: true }
        - { name: feed-keyring, mountPath: /etc/dpumesh/feed.keys, readOnly: true }
        - { name: nodes, mountPath: /etc/dpumesh/nodes, subPath: nodes, readOnly: true }
        - { name: identity-stage, mountPath: /run/dpumesh/linkerd-identity, readOnly: true }
        - { name: infiniband, mountPath: /dev/infiniband }
        - { name: host-cgroup, mountPath: /host-cgroup }
        # systemd owns the steady broker's parentage.  This is what lets an
        # agent Pod roll without its container shim retaining/killing brokers.
        - { name: host-systemd, mountPath: /run/systemd }
        - { name: host-dbus, mountPath: /run/dbus }
        - { name: broker-runtime, mountPath: /var/lib/dpumesh }
        # The host's xtables lock, so the guard serializes with kube-proxy —
        # and a writable path for it, since the root filesystem is read-only.
        - { name: xtables-lock, mountPath: /run/xtables.lock }
      volumes:
      - name: socket
        hostPath: { path: /run/dpumesh, type: DirectoryOrCreate }
      - name: xtables-lock
        hostPath: { path: /run/xtables.lock, type: FileOrCreate }
      - name: keyring
        hostPath: { path: /etc/dpumesh/registration.keys, type: Directory }
      - name: feed-keyring
        hostPath: { path: /etc/dpumesh/feed.keys, type: Directory }
      - name: nodes
        configMap: { name: dpumesh-controller-nodes }
      # Identity material is provisioned on the host and delivered from here;
      # nothing on this path reaches the DPU except through the agent.
      - name: identity-stage
        hostPath: { path: ${DPUMESH_IDENTITY_STAGE_DIR}, type: DirectoryOrCreate }
      - name: infiniband
        hostPath: { path: /dev/infiniband, type: Directory }
      - name: host-cgroup
        hostPath: { path: /sys/fs/cgroup, type: Directory }
      - name: host-systemd
        hostPath: { path: /run/systemd, type: Directory }
      - name: host-dbus
        hostPath: { path: /run/dbus, type: Directory }
      - name: broker-runtime
        hostPath: { path: /var/lib/dpumesh, type: DirectoryOrCreate }
