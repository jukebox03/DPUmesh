apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpumesh-controller
  namespace: ${NS}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dpumesh-controller
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dpumesh-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dpumesh-controller
subjects:
- kind: ServiceAccount
  name: dpumesh-controller
  namespace: ${NS}
---
apiVersion: v1
kind: Service
metadata:
  name: dpumesh-controller
  namespace: ${NS}
spec:
  selector: { app: dpumesh-controller }
  ports:
  - { name: node-mtls, port: 8443, targetPort: 8443 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpumesh-controller-nodes
  namespace: ${NS}
data:
  nodes: |
${DPUMESH_CONTROLLER_NODES_YAML}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpumesh-controller
  namespace: ${NS}
spec:
  replicas: 1
  selector:
    matchLabels: { app: dpumesh-controller }
  template:
    metadata:
      labels: { app: dpumesh-controller }
    spec:
      serviceAccountName: dpumesh-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: controller
        image: docker.io/${IMG_CONTROLLER}
        imagePullPolicy: Never
        args:
        - --key-dir=/etc/dpumesh/controller.keys
        - --registration-key-dir=/etc/dpumesh/registration.keys
        - --feed-key-dir=/etc/dpumesh/feed.keys
        - --nodes-file=/etc/dpumesh/nodes
        - --output=/run/dpumesh/topology.v1
        - --cluster-id=${DPUMESH_CLUSTER_ID}
        - --listen-port=8443
        - --tls-cert=/etc/dpumesh/tls/tls.crt
        - --tls-key=/etc/dpumesh/tls/tls.key
        - --client-ca=/etc/dpumesh/node-ca/ca.crt
${DPUMESH_CONTROLLER_PROTECTED_ARGS}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        ports:
        - { name: node-mtls, containerPort: 8443 }
        readinessProbe:
          httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
        volumeMounts:
        - { name: output, mountPath: /run/dpumesh }
        - { name: signing, mountPath: /etc/dpumesh/controller.keys, readOnly: true }
        - { name: registration, mountPath: /etc/dpumesh/registration.keys, readOnly: true }
        - { name: feed, mountPath: /etc/dpumesh/feed.keys, readOnly: true }
        - { name: tls, mountPath: /etc/dpumesh/tls, readOnly: true }
        - { name: node-ca, mountPath: /etc/dpumesh/node-ca, readOnly: true }
        - { name: nodes, mountPath: /etc/dpumesh/nodes, subPath: nodes, readOnly: true }
      volumes:
      - name: output
        emptyDir: {}
      - name: signing
        secret:
          secretName: dpumesh-controller-signing
          defaultMode: 0440
          items:
          - { key: active, path: active }
          - { key: signing-key, path: ${DPUMESH_CONTROLLER_KEY_ID}.key }
      - name: registration
        secret:
          secretName: dpumesh-registration-signing
          defaultMode: 0440
          items:
          - { key: active, path: ${DPUMESH_NODE_NAME}/active }
          - { key: signing-key, path: ${DPUMESH_NODE_NAME}/${DPUMESH_REGISTRATION_KEY_ID}.key }
      - name: feed
        secret:
          secretName: dpumesh-feed-signing
          defaultMode: 0440
          items:
          - { key: active, path: active }
          - { key: signing-key, path: ${DPUMESH_FEED_KEY_ID}.key }
      - name: tls
        secret: { secretName: dpumesh-controller-tls, defaultMode: 0440 }
      - name: node-ca
        configMap: { name: dpumesh-node-ca, defaultMode: 0444 }
      - name: nodes
        configMap: { name: dpumesh-controller-nodes, defaultMode: 0444 }
