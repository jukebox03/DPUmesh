# Inbound policy on the *destination* of a crossing route. A Server with no
# AuthorizationPolicy denies every client, so a route that reaches this Service
# must be refused here — by the callee's policy, not the caller's.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: bench-echo-grpc-alt
  namespace: ${NS}
spec:
  podSelector:
    matchLabels:
      app: echo-grpc-alt
  port: ${CTRL_PORT}
  proxyProtocol: gRPC
