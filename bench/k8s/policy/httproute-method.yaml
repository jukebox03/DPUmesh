# Method matching. gRPC is POST over HTTP/2, so POST is the arm that must
# match and any other verb is the negative control that must not.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bench-grpc-route
  namespace: ${NS}
spec:
  parentRefs:
    - group: core
      kind: Service
      name: echo-grpc-dpumesh
      port: ${CTRL_PORT}
  rules:
    - matches:
        - method: ${ROUTE_METHOD}
      backendRefs:
        - group: core
          kind: Service
          name: echo-grpc-dpumesh
          port: ${CTRL_PORT}
