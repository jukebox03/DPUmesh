# Header matching, on a header the client sends without being asked to:
# every gRPC request carries content-type: application/grpc.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bench-grpc-route
  namespace: ${NS}
spec:
  parentRefs:
    - group: core
      kind: Service
      name: echo-grpc-dpumesh
      port: ${CTRL_PORT}
  rules:
    - matches:
        - headers:
            - type: Exact
              name: "${ROUTE_HEADER_NAME}"
              value: "${ROUTE_HEADER_VALUE}"
      backendRefs:
        - group: core
          kind: Service
          name: echo-grpc-dpumesh
          port: ${CTRL_PORT}
