# A route whose backend is a different Service — the ordinary shape of a canary.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bench-grpc-route
  namespace: ${NS}
spec:
  parentRefs:
    - group: core
      kind: Service
      name: echo-grpc-dpumesh
      port: ${CTRL_PORT}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "${ROUTE_PATH}"
      backendRefs:
        - group: core
          kind: Service
          name: ${ROUTE_BACKEND}
          port: ${CTRL_PORT}
