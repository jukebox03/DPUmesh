# Outbound routing for the protocol-aware gRPC Service. The parent is the
# Service the DPU dials, which is the address its outbound policy discovery
# asks about; the match is the gRPC method path the benchmark calls.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bench-grpc-route
  namespace: ${NS}
spec:
  parentRefs:
    - group: core
      kind: Service
      name: echo-grpc-dpumesh
      port: ${CTRL_PORT}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "${ROUTE_PATH}"
      backendRefs:
        - group: core
          kind: Service
          name: ${ROUTE_BACKEND}
          port: ${CTRL_PORT}
