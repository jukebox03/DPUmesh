# Authorization whose subject is a route rather than a port.
#
# The route kind has to match the Server's protocol. `server-grpc.yaml` names
# gRPC, and a gRPC Server carries gRPC routes: a `policy.linkerd.io` HTTPRoute
# parented to it is indexed under a protocol the Server does not speak, and the
# policy that targets it never reaches the destination at all.
#
# The verdict this admits by is connection-level and is the union over the
# routes: the connection is refused exactly when no route would admit this
# caller. Which route a request then matches is not enforced.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: bench-grpc-inbound-route
  namespace: ${NS}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: bench-echo-grpc
      namespace: ${NS}
  rules:
    - matches:
        - method:
            type: Exact
            service: "${GRPC_SERVICE}"
            method: "${GRPC_METHOD}"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: bench-route-caller
  namespace: ${NS}
spec:
  identities:
    - "${POLICY_IDENTITY}"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: bench-allow-route
  namespace: ${NS}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: bench-grpc-inbound-route
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: bench-route-caller
