# A second endpoint of the protocol-aware Service that always fails. The
# Service selector is what puts it in the same balancer as the healthy one,
# which is where a circuit breaker can act: ejecting it moves traffic to the
# endpoint beside it. A failing backend a route chose by weight has nowhere to
# be ejected to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-grpc-broken
  namespace: ${NS}
spec:
  replicas: 1
  selector: { matchLabels: { run: echo-grpc-broken } }
  template:
    metadata:
      annotations: { config.linkerd.io/skip-inbound-ports: "${CTRL_PORT}" }
      labels:
        app: echo-grpc-dpumesh
        run: echo-grpc-broken
        linkerd.io/control-plane-ns: linkerd
    spec:
      hostname: echo-grpc-broken
      containers:
      - name: echo-grpc-broken
        image: docker.io/${IMG_ECHO_GRPC}
        imagePullPolicy: Never
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TRANSPORT, value: "dmesh" }
        - { name: DPUMESH_PCI_ADDR, value: "${HOST_PCI}" }
        - { name: DPUMESH_RINGS_PER_POD, value: "${DPUMESH_RINGS_PER_POD}" }
        - { name: DPUMESH_ATTEST_SOCKET, value: "${DPUMESH_ATTEST_SOCKET}" }
        - { name: DPUMESH_SERVICE, value: "echo-grpc-dpumesh" }
        - { name: BENCH_REACTORS, value: "${BENCH_REACTORS}" }
        - { name: BENCH_FAIL_EVERY, value: "1" }
        securityContext: { privileged: true }
        volumeMounts:
        - { mountPath: /dev/infiniband, name: infiniband }
        - { mountPath: /usr/local/lib/libdpumesh.so.5, name: libdpumesh-so, subPath: libdpumesh.so.5 }
        - { mountPath: /run/dpumesh, name: dpumesh-attest, readOnly: true }
      volumes:
      - { name: infiniband, hostPath: { path: /dev/infiniband } }
      - { name: libdpumesh-so, hostPath: { path: ${LIB_OUT}, type: Directory } }
      - { name: dpumesh-attest, hostPath: { path: /run/dpumesh, type: DirectoryOrCreate } }
