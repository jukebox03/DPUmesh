# Weighted backendRefs across two Services. The weights are the arm: what the
# client completes has to land on both destinations in the declared ratio.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bench-grpc-route
  namespace: ${NS}
spec:
  parentRefs:
    - group: core
      kind: Service
      name: echo-grpc-dpumesh
      port: ${CTRL_PORT}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "${ROUTE_PATH}"
      backendRefs:
        - group: core
          kind: Service
          name: echo-grpc-dpumesh
          port: ${CTRL_PORT}
          weight: ${ROUTE_WEIGHT_A}
        - group: core
          kind: Service
          name: echo-grpc-alt
          port: ${CTRL_PORT}
          weight: ${ROUTE_WEIGHT_B}
