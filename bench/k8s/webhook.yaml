# The admission webhook that makes a workload meshed from one annotation.
#
# Registration is scoped to a single namespace by the automatic
# `kubernetes.io/metadata.name` label, and inside that namespace the webhook
# is load-bearing: a Pod admitted without it is born unpatched, carries no
# shim, and keeps working over kernel TCP with no identity and no policy —
# and nothing in the cluster shows anything is missing. `failurePolicy: Fail`
# therefore refuses Pod creation while the webhook cannot answer; the
# Deployment controller retries the Pod into existence once it can. What that
# costs is creation of new Pods in this one namespace while the webhook is
# down — never Pods already running, because admission is the only moment
# this process touches.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpumesh-webhook
  namespace: ${NS}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dpumesh-webhook
rules:
# The injection trigger is a Namespace annotation, and label selectors cannot
# read annotations, so the decision needs the object itself.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
# Admission runs before scheduling: the only question that can be asked about
# nodes here is whether any of them can serve a meshed Pod at all.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
# The serving certificate is generated in-process, so this registration is
# what has to learn its CA.
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "patch"]
  resourceNames: ["dpumesh-inject"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dpumesh-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dpumesh-webhook
subjects:
- kind: ServiceAccount
  name: dpumesh-webhook
  namespace: ${NS}
---
apiVersion: v1
kind: Service
metadata:
  name: dpumesh-webhook
  namespace: ${NS}
spec:
  selector: { app: dpumesh-webhook }
  ports:
  - { name: https, port: 443, targetPort: 8443 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpumesh-webhook
  namespace: ${NS}
spec:
  replicas: 1
  selector:
    matchLabels: { app: dpumesh-webhook }
  template:
    metadata:
      labels: { app: dpumesh-webhook }
    spec:
      serviceAccountName: dpumesh-webhook
      terminationGracePeriodSeconds: 5
      containers:
      - name: webhook
        image: docker.io/${IMG_CONTROLLER}
        imagePullPolicy: Never
        command: ["/usr/local/bin/dpumesh-webhook"]
        args:
        - --listen-port=8443
        - --tls-cert=/run/dpumesh-webhook/tls.crt
        - --tls-key=/run/dpumesh-webhook/tls.key
        - --service-dns=dpumesh-webhook.${NS}.svc,dpumesh-webhook.${NS}.svc.cluster.local
        - --publish-ca-bundle=dpumesh-inject
        - --linkerd-namespace=linkerd
        - --library-dir=${LIB_OUT}
        - --library-soname=libdpumesh.so.5
        - --attest-dir=/run/dpumesh
        - --attest-socket=${DPUMESH_ATTEST_SOCKET}
        - --pci-addr=${HOST_PCI}
        - --rings-per-pod=${DPUMESH_RINGS_PER_POD}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        ports:
        - { name: https, containerPort: 8443 }
        readinessProbe:
          httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - { name: tls, mountPath: /run/dpumesh-webhook }
      volumes:
      # The certificate lives exactly as long as the process that generated it
      # and republishes its CA on every start.
      - { name: tls, emptyDir: {} }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: dpumesh-inject
webhooks:
- name: inject.dpumesh.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  # The decision may need two API reads (Namespace, then nodes) of up to 10 s
  # each; the admission deadline must outlast both or a slow API server turns
  # into a refusal the webhook never made.
  timeoutSeconds: 30
  reinvocationPolicy: Never
  # The webhook's own Pod must not be gated by the webhook.
  objectSelector:
    matchExpressions:
    - key: app
      operator: NotIn
      values: ["dpumesh-webhook"]
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: ["${NS}"]
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: Namespaced
  clientConfig:
    service:
      name: dpumesh-webhook
      namespace: ${NS}
      path: /mutate
      port: 443
