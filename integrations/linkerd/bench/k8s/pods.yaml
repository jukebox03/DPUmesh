---
# linkerd L7 benchmark pods. bench.sh applies this alongside bench/k8s/pods.yaml
# and integrations/grpc/bench/k8s/pods.yaml as one stream, and substitutes the
# same image, port, and runtime variables. Deployments start with zero replicas.
#
# The gRPC binaries are byte-identical to the Envoy and TCP paths: only
# BENCH_TRANSPORT=tcp plus the injected sidecar differ, so the collector's
# binary audit passes and the comparison stays matched.
#
# Two linkerd columns:
#   grpc-linkerd         proxy detects HTTP/2 and proxies at L7, mTLS inter-pod
#   grpc-linkerd-opaque  port marked opaque, so the proxy forwards bytes, mTLS
# linkerd has no plaintext mode between meshed pods; both columns are mutually
# authenticated and encrypted, which makes grpc-envoy-strict the matched Envoy
# comparison and grpc-envoy-permissive the plaintext floor.
#
# The client's control port is excluded from inbound redirection: it carries the
# collector's RUN command, not benchmark traffic, so proxying it would add a
# protocol-detection step and sidecar CPU to a channel that is not under test.
# ---------------------------------------------------------------- linkerd L7 (protocol detection)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-grpc-linkerd
spec:
  replicas: 0
  selector: { matchLabels: { app: bench-grpc-linkerd } }
  template:
    metadata:
      labels: { app: bench-grpc-linkerd }
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/skip-inbound-ports: "${CTRL_PORT}"
    spec:
      containers:
      - name: bench-grpc-linkerd
        image: docker.io/${IMG_BENCH_GRPC}
        imagePullPolicy: Never
        ports: [{ containerPort: ${CTRL_PORT} }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TRANSPORT, value: "tcp" }
        - { name: BENCH_TARGET, value: "echo-grpc-linkerd:9092" }
---
apiVersion: v1
kind: Service
metadata: { name: bench-grpc-linkerd }
spec:
  selector: { app: bench-grpc-linkerd }
  ports: [{ port: ${CTRL_PORT}, targetPort: ${CTRL_PORT} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-grpc-linkerd
spec:
  replicas: 0
  selector: { matchLabels: { app: echo-grpc-linkerd } }
  template:
    metadata:
      labels: { app: echo-grpc-linkerd }
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: echo-grpc-linkerd
        image: docker.io/${IMG_ECHO_GRPC}
        imagePullPolicy: Never
        ports: [{ containerPort: 9092 }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TRANSPORT, value: "tcp" }
        - { name: ECHO_PORT, value: "9092" }
---
apiVersion: v1
kind: Service
metadata: { name: echo-grpc-linkerd }
spec:
  selector: { app: echo-grpc-linkerd }
  ports: [{ port: 9092, targetPort: 9092 }]
---
# ---------------------------------------------------------------- linkerd opaque (TCP forwarding)
# Same proxy, same mTLS, protocol detection disabled on the benchmark port. This
# is the column that lines up with the Envoy tcp_proxy sidecars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-grpc-linkerd-opaque
spec:
  replicas: 0
  selector: { matchLabels: { app: bench-grpc-linkerd-opaque } }
  template:
    metadata:
      labels: { app: bench-grpc-linkerd-opaque }
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/skip-inbound-ports: "${CTRL_PORT}"
    spec:
      containers:
      - name: bench-grpc-linkerd-opaque
        image: docker.io/${IMG_BENCH_GRPC}
        imagePullPolicy: Never
        ports: [{ containerPort: ${CTRL_PORT} }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TRANSPORT, value: "tcp" }
        - { name: BENCH_TARGET, value: "echo-grpc-linkerd-opaque:9092" }
---
apiVersion: v1
kind: Service
metadata: { name: bench-grpc-linkerd-opaque }
spec:
  selector: { app: bench-grpc-linkerd-opaque }
  ports: [{ port: ${CTRL_PORT}, targetPort: ${CTRL_PORT} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-grpc-linkerd-opaque
spec:
  replicas: 0
  selector: { matchLabels: { app: echo-grpc-linkerd-opaque } }
  template:
    metadata:
      labels: { app: echo-grpc-linkerd-opaque }
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/opaque-ports: "9092"
    spec:
      containers:
      - name: echo-grpc-linkerd-opaque
        image: docker.io/${IMG_ECHO_GRPC}
        imagePullPolicy: Never
        ports: [{ containerPort: 9092 }]
        env:
        - { name: BENCH_NUMA_NODE, value: "${BENCH_NUMA_NODE}" }
        - { name: BENCH_TRANSPORT, value: "tcp" }
        - { name: ECHO_PORT, value: "9092" }
---
# The Service annotation is what the client's proxy reads: it decides opacity
# from the destination it dials, not from its own pod.
apiVersion: v1
kind: Service
metadata:
  name: echo-grpc-linkerd-opaque
  annotations:
    config.linkerd.io/opaque-ports: "9092"
spec:
  selector: { app: echo-grpc-linkerd-opaque }
  ports: [{ port: 9092, targetPort: 9092 }]
