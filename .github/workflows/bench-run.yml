name: bench-run

on:
  workflow_dispatch:
    inputs:
      solution:
        description: 'which transport to measure'
        type: choice
        options: [dpumesh, tcp, both]
        default: dpumesh
      req:
        description: 'request size in bytes'
        default: '64'
      reply:
        description: 'reply size in bytes'
        default: '64'
      conc:
        description: 'concurrency window'
        default: '32'
      dur:
        description: 'seconds per point'
        default: '10'
      threads:
        description: 'client threads'
        default: '2'
      repeats:
        description: 'how many times to repeat the point'
        default: '3'

# The same machine the build job uses, and a measurement is worthless if a
# build runs beside it.
concurrency:
  group: rapids4
  cancel-in-progress: false

jobs:
  measure:
    runs-on: [self-hosted, linux, x64, rapids4]
    timeout-minutes: 45
    env:
      # Inputs never reach a shell as ${{ }} text; they arrive as environment
      # values so nothing in them can be read as shell syntax.
      SOLUTION: ${{ inputs.solution }}
      REQ: ${{ inputs.req }}
      REPLY: ${{ inputs.reply }}
      CONC: ${{ inputs.conc }}
      DUR: ${{ inputs.dur }}
      THREADS: ${{ inputs.threads }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v5

      # This workflow measures what is already deployed. It never deploys:
      # bench.sh deploy rebuilds the DPU and restarts every pod.
      # bench.sh reads the DPU's address and sudo password from .env at the repo
      # root, and .env is not in git. Link the operator's copy instead of making
      # a second one inside the runner workspace; checkout clears the link on the
      # next run.
      - name: Link the deploy environment
        run: |
          env_file="${DPUMESH_ENV_FILE:-$HOME/DPUmesh/.env}"
          [ -f "$env_file" ] || { echo "no .env at $env_file; the DPU log cannot be read"; exit 1; }
          ln -sf "$env_file" .env

      - name: The pods must already be up
        run: |
          ns="${NS:-test-bench}"
          kubectl get pods -n "$ns" || { echo "no cluster access, or namespace $ns is gone"; exit 1; }
          for sol in $( [ "$SOLUTION" = both ] && echo "dpumesh tcp" || echo "$SOLUTION" ); do
            app="bench-$sol"
            kubectl get pod -n "$ns" -l "app=$app" \
              -o go-template='{{range .items}}{{.status.phase}}{{"\n"}}{{end}}' | grep -qx Running \
              || { echo "$app has no Running pod; deploy first (bench/bench.sh deploy)"; exit 1; }
          done

      - name: Measure
        run: |
          # Read once, before the first point: a measurement that cannot name
          # the machine it came from is not comparable to any other.
          mapfile -t CFG < <(ci/bench-config.sh) || exit 1
          printf '%s\n' "${CFG[@]}"
          : > results.jsonl
          fail=0
          for sol in $( [ "$SOLUTION" = both ] && echo "dpumesh tcp" || echo "$SOLUTION" ); do
            for i in $(seq 1 "$REPEATS"); do
              echo "[point] $sol repeat $i/$REPEATS"
              raw=$(bench/bench.sh point "$sol" "$REQ" "$REPLY" "$CONC" "$DUR" 1000 "$THREADS" 2>&1 </dev/null)
              if json=$(printf '%s\n' "$raw" | ci/bench-to-json.py \
                    solution="$sol" repeat="$i" commit="$GITHUB_SHA" \
                    run_id="$GITHUB_RUN_ID" ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    "${CFG[@]}"); then
                printf '%s\n' "$json" >> results.jsonl
              else
                fail=$((fail + 1))
              fi
            done
          done
          echo "recorded $(wc -l < results.jsonl) points, $fail refused"
          [ "$fail" -eq 0 ]

      - name: Summary
        if: always()
        run: |
          [ -s results.jsonl ] || { echo "no points recorded" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### ${REQ}B/${REPLY}B conc=${CONC} threads=${THREADS} dur=${DUR}s"
            echo
            echo "| solution | repeat | Mrps | p50 us | p99 us |"
            echo "|---|---|---|---|---|"
            python3 -c 'import json;[print("| {solution} | {repeat} | {mrps} | {p50} | {p99} |".format(**json.loads(l))) for l in open("results.jsonl")]'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: results.jsonl
          if-no-files-found: warn
