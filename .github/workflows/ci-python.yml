name: python-contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The attestation agent signs its grant with Ed25519, the same dependency
      # its image installs.
      - run: pip install --no-cache-dir cryptography

      - run: python3 tests/analyze_saturation_test.py
      - run: python3 tests/summarize_l4_test.py
      - run: python3 tests/workload_attest_agent_test.py
      - run: python3 tests/linkerd_cp_relay_test.py
      - run: python3 tests/dpumesh_controller_test.py
      - run: python3 tests/feed_delivery_test.py
