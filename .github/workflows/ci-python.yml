name: python-contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python3 tests/analyze_saturation_test.py
      - run: python3 tests/summarize_l4_test.py
      - run: python3 tests/workload_attest_agent_test.py
      - run: python3 tests/linkerd_cp_relay_test.py
