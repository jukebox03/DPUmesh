name: rust-fmt

# The one file this checks is linkerd/rust/src/lib.rs, so nothing else needs to
# wake it. rust-build.yml filters on the same subtree.
on:
  push:
    paths:
      - 'linkerd/rust/**'
      - '.github/workflows/rust-fmt.yml'
  pull_request:
    paths:
      - 'linkerd/rust/**'
      - '.github/workflows/rust-fmt.yml'
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkerd/rust
    steps:
      - uses: actions/checkout@v5

      - name: Report the pinned toolchain
        run: rustc --version

      - name: Install rustfmt for the pinned toolchain
        run: rustup component add rustfmt

      - name: Check formatting
        run: rustfmt --check --edition 2021 src/lib.rs
