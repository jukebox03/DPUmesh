name: bench-publish

on:
  workflow_dispatch:
  # Nightly, once someone decides that an unattended run on a shared research
  # machine is acceptable. Until then this is a deliberate, manual act.
  # schedule:
  #   - cron: '0 18 * * *'

concurrency:
  group: rapids4
  cancel-in-progress: false

permissions:
  contents: write        # to append to the gh-pages branch

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, rapids4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: The pods must already be up
        run: |
          ns="${NS:-test-bench}"
          kubectl get pods -n "$ns" >/dev/null || { echo "namespace $ns is not reachable"; exit 1; }
          for app in bench-dpumesh bench-tcp; do
            kubectl get pod -n "$ns" -l "app=$app" \
              -o go-template='{{range .items}}{{.status.phase}}{{"\n"}}{{end}}' | grep -qx Running \
              || { echo "$app has no Running pod; deploy first (bench/bench.sh deploy)"; exit 1; }
          done

      # The operating points come from ci/bench-frozen.txt, never from workflow
      # inputs: a series whose operating point can be changed per run is not a
      # series. A point that is not OK is skipped and the step fails, so a gap
      # in the data is visible as a red run rather than as a silent absence.
      - name: Measure the frozen set
        id: measure
        continue-on-error: true
        run: ci/bench-frozen-run.sh new.jsonl

      - name: Append to the published history and rebuild the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s new.jsonl ] || { echo "nothing measured; not publishing"; exit 1; }
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf pages
          if ! git clone --quiet --depth 1 --branch gh-pages "$url" pages 2>/dev/null; then
            echo "gh-pages does not exist yet; starting it"
            mkdir pages
            git -C pages init --quiet -b gh-pages
            git -C pages remote add origin "$url"
          fi
          mkdir -p pages/data
          cat new.jsonl >> pages/data/history.jsonl
          ci/bench-page.py pages/data/history.jsonl pages/index.html
          touch pages/.nojekyll          # keep Jekyll from eating data/ and the page
          git -C pages config user.name  "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add -A
          git -C pages commit --quiet \
            -m "bench: $(wc -l < pages/data/history.jsonl) points through ${GITHUB_SHA:0:7}"
          git -C pages push --quiet origin gh-pages
          {
            echo "### published"
            echo "- added $(wc -l < new.jsonl) points from \`ci/bench-frozen.txt\`"
            echo "- history now holds $(wc -l < pages/data/history.jsonl) points"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any frozen point did not come back OK
        if: steps.measure.outcome == 'failure'
        run: |
          echo "the page was published, but at least one operating point produced no measurement"
          exit 1
