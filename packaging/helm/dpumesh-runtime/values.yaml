image: bench/dpumesh-dpu:kubernetes
imagePullPolicy: IfNotPresent
# Keep the full Linkerd identity <=64 bytes for the CSR CommonName.
serviceAccountName: dpu
# This release describes one host/DPU pair. Use separate releases for different
# hardware/configuration; never load balance the local registration endpoint.
dpuNode: ""
hostNode: ""
clusterID: ""
pci: ""
representor: ""

localBind: ""
configDirectory: /etc/dpumesh
runtimeDirectory: /run/dpumesh-runtime
env: {}
linkerd:
  enabled: false
  namespace: linkerd
  trustDomain: cluster.local
  trustRootsConfigMap: linkerd-identity-trust-roots
resources:
  requests:
    cpu: "4"
    memory: 2Gi
  limits:
    memory: 8Gi
